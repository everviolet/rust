when:
  event: cron
  cron: update

variables:
  - &branch 'feat/sync-palettes'
  - &message 'feat: sync upstream palettes'

steps:
  - name: palette
    image: alpine/curl
    commands:
      - curl -Lo src/palette.json 'https://codeberg.org/evergarden/palette/raw/main/palette.json'
  - name: commit
    image: alpine/git
    depends_on: [palette]
    environment:
      BRANCH: *branch
      MESSAGE: *message
      MIMI_TOKEN:
        from_secret: MIMI_TOKEN
    commands:
      - |
        if git diff --quiet; then
          echo "no changes"
          exit 0
        fi
      - git config --global user.name "mimi"
      - git config --global user.email "mimi@koi.rip"
      - git remote set-url origin "https://${CI_REPO_OWNER}:$${MIMI_TOKEN}@codeberg.org/${CI_REPO}.git"
      - git checkout -b "$${BRANCH}"
      - git add src/palette.json
      - git commit -m "$${MESSAGE}"
      - git push -u origin "$${BRANCH}" --force
  - name: open pull request
    image: woodpeckercommunity/gitea-pull-request-create-plugin
    depends_on: [commit]
    settings:
      gitea_address: https://codeberg.org
      gitea_token:
        from_secret: MIMI_TOKEN
      owner: ${CI_REPO_OWNER}
      repo: ${CI_REPO_NAME}
      base_branch: ${CI_REPO_DEFAULT_BRANCH}
      branch: *branch
      pr_title: *message
      pr_body: "[beep boop](${CI_PIPELINE_URL}) :3"
      skip_on_missing_branch: true
      delete_branch_after_merge: true
